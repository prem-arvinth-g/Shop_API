<header class="site-header">
  <div class="container header-row">
    <a routerLink="/" class="brand" aria-label="Anand Cotton Sarees home">
      <img src="brand/logo-mark.png" alt="" class="brand-mark" width="64" height="48">
      <img src="brand/logo-text.png" alt="Anand Cotton Sarees" class="brand-text" width="150" height="44">
    </a>

    <form class="search" role="search" (ngSubmit)="search()">
      <input type="search" name="q" [(ngModel)]="q" placeholder="Search sarees, colours…" aria-label="Search sarees">
      <button type="submit" class="btn btn-sm">Search</button>
    </form>

    <nav class="nav" aria-label="Main">
      <a routerLink="/shop" routerLinkActive="active">Shop</a>
      <a routerLink="/cart" routerLinkActive="active" class="cart-link">
        Cart <span class="badge">{{ cart.count() }}</span>
      </a>

      @if (auth.me(); as me) {
        <!-- Profile button: first letter of the email. Click opens the menu; clicking anywhere else closes it (header.ts). -->
        <div class="profile">
          <button type="button" class="avatar" (click)="toggleMenu($event)"
                  [attr.aria-expanded]="menuOpen()" aria-haspopup="menu" aria-label="Account menu">
            {{ me.email[0].toUpperCase() }}
          </button>
          @if (menuOpen()) {
            <div class="profile-menu" role="menu" (click)="menuOpen.set(false)">
              <p class="profile-email">Signed in as<br><strong>{{ me.email }}</strong></p>
              <a routerLink="/orders" role="menuitem">My orders</a>
              @if (me.isAdmin) { <a routerLink="/admin" role="menuitem">Admin dashboard</a> }
              <button type="button" class="logout" role="menuitem" (click)="logout()">Logout</button>
            </div>
          }
        </div>
      } @else {
        <a routerLink="/login" routerLinkActive="active">Login</a>
      }
    </nav>
  </div>
</header>
