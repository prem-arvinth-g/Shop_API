# Render "Blueprint": Render reads this file and creates the web service from the Dockerfile.
# Secrets are NOT stored here (sync: false). You type them once in the Render dashboard.
services:
  - type: web
    name: anand-cotton-sarees
    runtime: docker
    plan: free
    region: singapore        # same region as the Neon database = fast queries
    healthCheckPath: /api/categories
    envVars:
      - key: ConnectionStrings__Postgres     # from Neon (".NET" connection string format)
        sync: false
      - key: ADMIN_EMAILS                    # e.g. owner@gmail.com (comma separated for more)
        sync: false
      - key: RAZORPAY_KEY_ID                 # rzp_test_... first, rzp_live_... after KYC
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY                   # Brevo > Settings > SMTP & API > API keys (starts with xkeysib-)
        sync: false
      - key: EMAIL_FROM                      # a sender email you verified in Brevo
        sync: false
